---
## Benchmark ID
id: daa_benchmark

## Description
description: "Differential Abundance Analysis Benchmark"

## Version
version: 1.0

## 
methods_dir: "methods" # added this for Omnibenchmark to know where to look for methods within repo 

## Contact
benchmarker: "Lorenzo, lorenzofavaro.soa@gmail.com"

## Storage
storage_api: S3
storage: out

## Schema version
benchmark_yaml_spec: 0.01

## Software backend
software_backend: conda

## Software environments
software_environments:
  python:
    description: "data generation env"
    conda: envs/data_generation.yml
  r_limma:
    description: "R environment with limma"
    conda: envs/limma.yml

stages:
  ## Datasets
  - id: data
    modules:
      - id: s1
        name: 'synthetic_data'
        software_environment: "python"
        repository:
          url: "https://github.com/lorenzo-22/synthetic_dataset"
          commit: 90f4a27
    outputs:
      - id: data.matrix
        path: "{dataset}.synthetic_dataset.csv"
      - id: data.true_labels
        path: "{dataset}.true_labels.csv"

## Methods
  - id: methods
    modules:
      - id: limma
        name: 'limma_method'
        software_environment: "r_limma"
        path: "limma" # Added this instead of repo as we now have the tools within this repo (Josefine, commit #)
      - id: welch
        name: "welch_ttest"
        software_environment: "welch"
        path: "welch" 

    inputs:
      - entries:
          - data.matrix
    outputs:
      - id: results
        path: "{dataset}_limma_results.csv"
    