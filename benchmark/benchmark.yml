---
## Benchmark ID
id: daa_benchmark

## Description
description: "Differential Abundance Analysis Benchmark"

## Version
version: 1.0

## Contact
benchmarker: "Lorenzo, lorenzofavaro.soa@gmail.com"

## Storage
storage_api: S3
storage: out

## Schema version
benchmark_yaml_spec: 0.01

## Software backend
software_backend: conda

## Software environments
software_environments:
  python:
    description: "data generation env"
    conda: envs/data_generation.yml
  python_basic:
    description: "Basic python env for simple methods and tools. Includes basis libs such as scipy and numpy"
    conda: envs/python_basic.yml
  r_limma:
    description: "R environment with limma"
    conda: envs/limma.yml
  python_inter_tool_metrics:
    description: "Python environment for metrics calculation"
    conda: envs/python_inter_tool_metrics.yml

stages:
  ## Datasets
  - id: data
    modules:
      - id: s1
        name: 'synthetic_data'
        software_environment: "python"
        repository:
          url: "https://github.com/lorenzo-22/synthetic_dataset"
          commit: 90f4a27
    outputs:
      - id: data.matrix
        path: "{dataset}.synthetic_dataset.csv"
      - id: data.true_labels
        path: "{dataset}.true_labels.csv"

  ## Methods
  - id: methods
    modules:
      - id: limma
        name: 'limma_method'
        software_environment: "r_limma"
        repository:
          url: "https://github.com/lorenzo-22/OmniBench-DAA_project/tree/main/methods/limma"
          commit: 50cdbc1      
      - id: welch
        name: "welch_ttest"
        software_environment: "python_basic"
        repository:
          url: "https://github.com/lorenzo-22/welch_t-test"
          commit: f98c916
    inputs:
      - entries:
          - data.matrix
          - data.true_labels
    outputs:
      - id: results
        path: "results/{dataset}_{module}_results.csv"

  - id: metrics
    modules:
      - id: inter_tool_metrics
        name: "Metrics comparing the outcomes of the tools tested"
        software_environment: "python_inter_tool_metrics"
        repository:
          url: "https://github.com/lorenzo-22/inter_metrics"
          commit: 9529179
    inputs:
      - entries:
          - results
    outputs:
      - id: inter_tool_metrics.scores
        path: "results"